services:
  # Frontend public Makoki. Nginx hôte relaie makoki.org vers 127.0.0.1:8088.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: https://makoki.org
        VITE_API_URL: https://makoki.org/api
    ports:
      - "127.0.0.1:8088:80"
    networks:
      - proxy-net
      - default
    restart: unless-stopped

  # Backend historique de développement. Le frontend de production ne dépend
  # pas de ce service : /api est routé vers l'alias riasec-api sur proxy-net.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "6464"
    environment:
      - PORT=6464
      - NODE_ENV=production
      - JWT_SECRET=your_jwt_secret_here
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=orientationpro
      - DB_PORT=3306
    depends_on:
      - db
    volumes:
      - ./backend:/app
    networks:
      - proxy-net
      - default
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "3310:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=orientationpro
      - MYSQL_USER=orientationpro
      - MYSQL_PASSWORD=password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8282:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=password
    depends_on:
      - db
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  proxy-net:
    external: true
    name: proxy-net
