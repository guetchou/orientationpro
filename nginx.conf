server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Utilise le DNS Docker au moment de la requête plutôt qu'au démarrage.
    # Le conteneur web peut ainsi démarrer seul pendant les smoke tests,
    # tout en résolvant l'alias riasec-api sur proxy-net en production.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Le backend de production est publié sur le réseau Docker proxy-net
    # avec l'alias stable riasec-api. Les routes OAuth ne doivent jamais
    # tomber dans le fallback React.
    location /api/ {
        set $api_upstream http://riasec-api:6464;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
