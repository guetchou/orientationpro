name: V6-H Workspace Fix

on:
  push:
    branches:
      - test/v6h-authenticated-recipe-20260802
    paths:
      - ops/recipe/apply-v6h-workspace-fix
  pull_request:
    branches:
      - main
    paths:
      - ops/recipe/apply-v6h-workspace-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/v6h-authenticated-recipe-20260802
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Apply targeted workspace patch
        run: node scripts/release/apply-v6h-workspace-fix.cjs

      - name: Validate TypeScript and focused tests
        run: |
          set -Eeuo pipefail
          npm ci
          npm run typecheck
          npm test -- src/features/life-project/GuestResultGate.test.ts

      - name: Commit patched workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/life-project/LifeProjectWorkspace.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat(life-project): afficher calendrier et synthèse imprimable'
          git push origin HEAD:test/v6h-authenticated-recipe-20260802
