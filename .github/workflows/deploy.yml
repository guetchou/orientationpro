name: Continuous Integration

on:
  pull_request:
    branches: [main, refactor/platform-web-mobile-foundation]
  push:
    branches: [main, refactor/platform-web-mobile-foundation]

permissions:
  contents: read

concurrency:
  group: orientationpro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:backend
      - run: npm test
      - run: npm run build

  backend:
    name: Backend security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: orientationpro_auth_test
          MYSQL_USER: orientationpro_test
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AUTH_TEST_DB_HOST: 127.0.0.1
      AUTH_TEST_DB_PORT: 3306
      AUTH_TEST_DB_USER: orientationpro_test
      AUTH_TEST_DB_PASSWORD: ci_test_password
      AUTH_TEST_DB_NAME: orientationpro_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Run MySQL tests
        id: mysql-tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:mysql 2>&1 | tee /tmp/mysql-test.log
      - name: Upload MySQL failure log
        if: failure() && steps.mysql-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mysql-test-failure
          path: /tmp/mysql-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Validate JavaScript syntax
        run: find src test -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  career-profile-functional:
    name: Authenticated career snapshot flow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: functional_root_password
          MYSQL_DATABASE: orientationpro_career_functional
          MYSQL_USER: orientationpro_functional
          MYSQL_PASSWORD: functional_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfunctional_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: orientationpro_functional
      DB_PASSWORD: functional_password
      DB_NAME: orientationpro_career_functional
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - run: npm --prefix backend ci
      - name: Run authenticated profile, RIASEC and snapshot flow
        run: node tests/e2e-career-profile-snapshot.cjs

  e2e-smoke:
    name: Browser smoke test
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
