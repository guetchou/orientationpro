name: Continuous Integration

on:
  pull_request:
    branches: [main, refactor/platform-web-mobile-foundation]
  push:
    branches: [main, refactor/platform-web-mobile-foundation]

permissions:
  contents: read

concurrency:
  group: orientationpro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality and browser flow
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:backend
      - run: npm test
      - run: npm run build
      - name: Run browser smoke against existing build
        run: node tests/e2e-smoke.cjs

  backend:
    name: Backend, MySQL and authenticated flows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: orientationpro_auth_test
          MYSQL_USER: orientationpro_test
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AUTH_TEST_DB_HOST: 127.0.0.1
      AUTH_TEST_DB_PORT: 3306
      AUTH_TEST_DB_USER: orientationpro_test
      AUTH_TEST_DB_PASSWORD: ci_test_password
      AUTH_TEST_DB_NAME: orientationpro_auth_test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: orientationpro_test
      DB_PASSWORD: ci_test_password
      DB_NAME: orientationpro_auth_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm --prefix backend test
      - name: Run MySQL tests
        id: mysql-tests
        shell: bash
        run: |
          set -o pipefail
          npm --prefix backend run test:mysql 2>&1 | tee /tmp/mysql-test.log
      - name: Upload MySQL failure log
        if: failure() && steps.mysql-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mysql-test-failure
          path: /tmp/mysql-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Validate JavaScript syntax
        run: find backend/src backend/test tests -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Prove one active RIASEC engine
        run: node tests/verify-riasec-single-engine.cjs
      - name: Run authenticated career snapshot flow
        run: node tests/e2e-career-profile-snapshot.cjs
      - name: Run authenticated profile hypotheses flow
        run: node tests/e2e-profile-hypotheses.cjs
      - name: Run authenticated profile synthesis flow
        run: node tests/e2e-profile-synthesis.cjs
