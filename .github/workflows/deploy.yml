name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor/platform-web-mobile-foundation]

permissions:
  contents: read

concurrency:
  group: orientationpro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: orientationpro_auth_test
          MYSQL_USER: orientationpro_test
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AUTH_TEST_DB_HOST: 127.0.0.1
      AUTH_TEST_DB_PORT: 3306
      AUTH_TEST_DB_USER: orientationpro_test
      AUTH_TEST_DB_PASSWORD: ci_test_password
      AUTH_TEST_DB_NAME: orientationpro_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:mysql
      - name: Validate JavaScript syntax
        run: find src test -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  e2e-smoke:
    name: Browser smoke test
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
