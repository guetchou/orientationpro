name: Probe production workflow runs

on:
  push:
    branches:
      - agent/probe-makemba02-account
    paths:
      - ops/recipe/probe-production-runs

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish production run inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-deploy.yml/runs?per_page=10" \
            >/tmp/runs.json

          inventory=$(jq -c '[.workflow_runs[] | {id, head_sha, head_branch, event, status, conclusion, created_at}]' /tmp/runs.json)
          body=$(cat <<EOF
          ## Inventaire ponctuel des déploiements production

          Run de diagnostic : \`${GITHUB_RUN_ID}\`

          \`\`\`json
          ${inventory}
          \`\`\`
          EOF
          )
          jq -n --arg body "${body}" '{body:$body}' >/tmp/comment.json
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/comment.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/226/comments" >/dev/null
