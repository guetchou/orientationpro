name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_PRODUCTION to deploy the selected main commit
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - ops/production/deploy-guest-first-life-project
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - ops/production/deploy-guest-first-life-project

permissions:
  contents: read

concurrency:
  group: orientationpro-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.confirmation == 'DEPLOY_PRODUCTION'
      ) ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release/production-')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: Production
      url: https://makoki.org
    env:
      DEPLOY_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate deployment authorization and scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/deploy-production-vps.sh
          bash -n scripts/release/activate-life-project-flags.sh

          case "${GITHUB_EVENT_NAME}" in
            push)
              test "${GITHUB_REF}" = refs/heads/main
              test -f ops/production/deploy-guest-first-life-project
              grep -qx 'DEPLOY_PRODUCTION' ops/production/deploy-guest-first-life-project
              ;;
            workflow_dispatch)
              test "${GITHUB_REF}" = refs/heads/main
              test "${{ inputs.confirmation }}" = DEPLOY_PRODUCTION
              ;;
            pull_request)
              test "${{ github.event.pull_request.merged }}" = true
              test "${{ github.event.pull_request.base.ref }}" = main
              test "${{ github.event.pull_request.head.repo.full_name }}" = "${GITHUB_REPOSITORY}"
              [[ "${{ github.event.pull_request.head.ref }}" == release/production-* ]]
              test -f ops/production/deploy-guest-first-life-project
              grep -qx 'DEPLOY_PRODUCTION' ops/production/deploy-guest-first-life-project
              ;;
            *)
              echo "Unsupported event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Configure restricted production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_KNOWN_HOSTS}"
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" >"${HOME}/.ssh/orientationpro-production"
          chmod 600 "${HOME}/.ssh/orientationpro-production"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Deploy through the restricted VPS gateway
        env:
          PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: |
          set -Eeuo pipefail
          test -n "${PRODUCTION_SSH_HOST}"
          test -n "${PRODUCTION_SSH_USER}"
          ssh \
            -i "${HOME}/.ssh/orientationpro-production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}" \
            "deploy ${DEPLOY_SHA}"

      - name: Verify public production endpoints and capabilities
        shell: bash
        run: |
          set -Eeuo pipefail

          for path in / /parcours /careers /cv-optimizer; do
            curl --fail --retry 12 --retry-all-errors --retry-delay 5 \
              "https://makoki.org${path}" >/dev/null
          done

          status=$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' \
            https://makoki.org/api/test/health)
          test "${status}" = 200

          capabilities_status=$(curl --silent --show-error --output /tmp/capabilities.json --write-out '%{http_code}' \
            https://makoki.org/api/v1/capabilities)
          test "${capabilities_status}" = 200

          instrument_status=$(curl --silent --show-error --output /tmp/riasec-instrument.json --write-out '%{http_code}' \
            https://makoki.org/api/v1/orientation/riasec/instrument)
          test "${instrument_status}" = 200

          guest_results_status=$(curl --silent --show-error \
            --cookie-jar /tmp/guest-cookie.jar \
            --output /tmp/guest-results.json --write-out '%{http_code}' \
            'https://makoki.org/api/v1/orientation/results?limit=1')
          test "${guest_results_status}" = 200
          grep -q 'makoki_guest_orientation' /tmp/guest-cookie.jar

          career_summary_status=$(curl --silent --show-error --output /tmp/career-summary.json --write-out '%{http_code}' \
            https://makoki.org/api/v1/career/catalog/summary)
          test "${career_summary_status}" = 200

          career_list_status=$(curl --silent --show-error --output /tmp/career-list.json --write-out '%{http_code}' \
            'https://makoki.org/api/v1/career/occupations?locale=fr&limit=1')
          test "${career_list_status}" = 200

          unauthenticated_status=$(curl --silent --show-error --output /tmp/life-project-unauthenticated.json --write-out '%{http_code}' \
            https://makoki.org/api/v1/life-projects)
          test "${unauthenticated_status}" = 401

          cv_unauthenticated_status=$(curl --silent --show-error --output /tmp/cv-unauthenticated.json --write-out '%{http_code}' \
            https://makoki.org/api/v1/cv/analyses)
          test "${cv_unauthenticated_status}" = 401

          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const registry = JSON.parse(fs.readFileSync('/tmp/capabilities.json', 'utf8'));
          const instrument = JSON.parse(fs.readFileSync('/tmp/riasec-instrument.json', 'utf8'));
          const guestResults = JSON.parse(fs.readFileSync('/tmp/guest-results.json', 'utf8'));
          const careerSummary = JSON.parse(fs.readFileSync('/tmp/career-summary.json', 'utf8'));
          const careerList = JSON.parse(fs.readFileSync('/tmp/career-list.json', 'utf8'));
          const byId = (id) => registry.capabilities.find((entry) => entry.id === id);

          if (health.status !== 'OK') throw new Error('Public health endpoint is not OK.');
          if (health.gitSha !== process.env.DEPLOY_SHA) {
            throw new Error(`Served SHA ${health.gitSha || 'null'} does not match ${process.env.DEPLOY_SHA}.`);
          }
          if (!instrument.instrument || instrument.instrument.itemCount !== 60) {
            throw new Error('Public orientation instrument is unavailable or incomplete.');
          }
          if (!Array.isArray(guestResults.results)) {
            throw new Error('Guest result history did not return an isolated result list.');
          }
          if (!Array.isArray(careerSummary.sources) || !Array.isArray(careerList.occupations)) {
            throw new Error('Public career catalog endpoints returned an invalid shape.');
          }

          const auth = byId('identity.auth-v1');
          const riasec = byId('orientation.riasec');
          const publicCareerCatalog = byId('career.catalog-public-v1');
          const lifeProject = byId('life-project.core-v1');
          const cv = byId('cv.analysis-v1');

          if (!auth || auth.status !== 'active' || auth.configured !== true) {
            throw new Error('Auth V1 is not active in production.');
          }
          if (
            !riasec ||
            riasec.status !== 'experimental' ||
            riasec.configured !== true ||
            riasec.configuration?.key !== 'LIFE_PROJECT_API_ENABLED'
          ) {
            throw new Error('Guest-capable orientation is not configured through Projet de vie in production.');
          }
          if (
            !publicCareerCatalog ||
            publicCareerCatalog.status !== 'experimental' ||
            publicCareerCatalog.configured !== true ||
            publicCareerCatalog.configuration?.key !== 'LIFE_PROJECT_API_ENABLED'
          ) {
            throw new Error('The public career catalog is not configured through Projet de vie.');
          }
          if (!lifeProject || lifeProject.status !== 'experimental' || lifeProject.configured !== true) {
            throw new Error('Projet de vie is not configured in production.');
          }
          if (
            !cv ||
            cv.status !== 'active' ||
            cv.configured !== true ||
            cv.configuration?.key !== 'CV_API_V1_ENABLED'
          ) {
            throw new Error('CV Analysis V1 is not active in production.');
          }

          for (const id of [
            'career.recommendations',
            'privacy.data-rights-v1',
            'ats.workflow-v1',
            'identity.auth-legacy',
          ]) {
            const capability = byId(id);
            if (!capability || capability.status !== 'disabled' || capability.configured !== false) {
              throw new Error(`${id} must remain disabled during the CV V1 activation.`);
            }
          }
          NODE
