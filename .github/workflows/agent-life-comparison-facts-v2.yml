name: Agent Life Comparison Facts V2

on:
  push:
    branches:
      - agent/makoki-life-comparison-facts-v2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/makoki-life-comparison-facts-v2' || github.ref_name == 'agent/makoki-life-comparison-facts-v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply structured comparison facts
        run: |
          python scripts/agent-apply-life-comparison-facts.py
          git config user.name "makoki-agent"
          git config user.email "makoki-agent@users.noreply.github.com"
          git add -A
          git commit -m "feat(life-project): exposer les faits structurés de comparaison"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
