name: V6-H Production Run Snapshot

on:
  push:
    branches:
      - agent/v6h-public-production-probe

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: aae2c39779e6d5c27dfa66c7de8d20380431b39f
      ISSUE_NUMBER: '184'
    steps:
      - name: Read current Production Deploy state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-deploy.yml/runs?branch=main&event=push&per_page=20" \
            >/tmp/runs.json

          TARGET_SHA="${TARGET_SHA}" node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/runs.json', 'utf8'));
          const run = (payload.workflow_runs || []).find((entry) => entry.head_sha === process.env.TARGET_SHA);
          const lines = [
            '## V6-H — instantané Production Deploy',
            '',
            `- SHA : \`${process.env.TARGET_SHA}\``,
            `- Run : ${run?.html_url || 'non trouvé'}`,
            `- Identifiant : \`${run?.id || 'absent'}\``,
            `- Statut : \`${run?.status || 'absent'}\``,
            `- Conclusion : \`${run?.conclusion || 'en attente'}\``,
          ];
          fs.writeFileSync('/tmp/run-snapshot.md', `${lines.join('\n')}\n`);
          NODE

      - name: Publish snapshot to issue 184
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n --rawfile body /tmp/run-snapshot.md '{body: $body}' >/tmp/comment.json
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/comment.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            >/tmp/comment-response.json
