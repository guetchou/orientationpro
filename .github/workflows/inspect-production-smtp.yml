name: Inspect production SMTP deployment

on:
  push:
    branches:
      - agent/probe-makemba02-account
    paths:
      - ops/recipe/inspect-production-smtp

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: 4cb3b7c61c973fc6861ab5d33881637081de8dfa
      TRACKING_ISSUE: '226'
    steps:
      - name: Publish observer checkpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          body=$(cat <<EOF
          ## Observateur du diagnostic SMTP démarré

          - Run observateur : \`${GITHUB_RUN_ID}\`
          - SHA production recherché : \`${TARGET_SHA}\`
          - État : recherche du workflow Production Deploy correspondant
          EOF
          )
          jq -n --arg body "${body}" '{body:$body}' >/tmp/checkpoint.json
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/checkpoint.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" >/dev/null

      - name: Wait for matching production deployment
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_id=''
          status=''
          conclusion=''

          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-deploy.yml/runs?branch=main&event=push&per_page=30" \
              >/tmp/runs.json

            run_id=$(jq -r --arg sha "${TARGET_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)][0].id // empty' /tmp/runs.json)
            if [[ -n "${run_id}" ]]; then
              status=$(jq -r --argjson id "${run_id}" '.workflow_runs[] | select(.id == $id) | .status' /tmp/runs.json)
              conclusion=$(jq -r --argjson id "${run_id}" '.workflow_runs[] | select(.id == $id) | (.conclusion // "en_attente")' /tmp/runs.json)
              echo "Production run ${run_id}: ${status}/${conclusion}"
              [[ "${status}" == completed ]] && break
            else
              echo "Matching production run not visible yet (${attempt}/60)."
            fi
            sleep 10
          done

          test -n "${run_id}"
          test "${status}" = completed
          echo "run_id=${run_id}" >>"${GITHUB_OUTPUT}"
          echo "conclusion=${conclusion}" >>"${GITHUB_OUTPUT}"

      - name: Download and extract sanitized SMTP evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.deployment.outputs.run_id }}
          CONCLUSION: ${{ steps.deployment.outputs.conclusion }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/logs" \
            --output /tmp/logs.zip
          mkdir -p /tmp/logs
          unzip -q /tmp/logs.zip -d /tmp/logs

          evidence=$(grep -RhoE '\{"status":"(accepted_by_smtp|smtp_partial_or_rejected|smtp_error)"[^[:cntrl:]]*\}' /tmp/logs | tail -n 1 || true)
          [[ -n "${evidence}" ]] || evidence='{"status":"rapport_smtp_non_trouve"}'

          body=$(cat <<EOF
          ## Diagnostic SMTP du déploiement production

          - SHA : \`${TARGET_SHA}\`
          - Run Production Deploy : \`${RUN_ID}\`
          - Conclusion du workflow : \`${CONCLUSION}\`
          - Rapport SMTP assaini :

          \`\`\`json
          ${evidence}
          \`\`\`

          Aucun hôte, utilisateur, mot de passe, identifiant brut ou réponse SMTP brute n’est publié.
          EOF
          )
          jq -n --arg body "${body}" '{body:$body}' >/tmp/comment.json
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/comment.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" >/dev/null
