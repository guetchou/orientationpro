name: V6-H Production Run Observer

on:
  push:
    branches:
      - agent/v6h-public-production-probe

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ded2983cb431491bf1ccf08a8cfa3d1d26673cc0
      ISSUE_NUMBER: '184'
    steps:
      - name: Observe Production Deploy run
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          found=false
          completed=false
          run_id=''
          run_url=''
          run_status='not_found'
          run_conclusion=''

          for attempt in $(seq 1 40); do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-deploy.yml/runs?branch=main&event=push&per_page=20" \
              >/tmp/runs.json

            eval "$(TARGET_SHA="${TARGET_SHA}" node <<'NODE'
            const fs = require('node:fs');
            const payload = JSON.parse(fs.readFileSync('/tmp/runs.json', 'utf8'));
            const run = (payload.workflow_runs || []).find((entry) => entry.head_sha === process.env.TARGET_SHA);
            const quote = (value) => `'${String(value ?? '').replaceAll("'", "'\\''")}'`;
            console.log(`RUN_ID=${quote(run?.id || '')}`);
            console.log(`RUN_URL=${quote(run?.html_url || '')}`);
            console.log(`RUN_STATUS=${quote(run?.status || 'not_found')}`);
            console.log(`RUN_CONCLUSION=${quote(run?.conclusion || '')}`);
            NODE
            )"

            run_id="${RUN_ID}"
            run_url="${RUN_URL}"
            run_status="${RUN_STATUS}"
            run_conclusion="${RUN_CONCLUSION}"

            if [[ -n "${run_id}" ]]; then
              found=true
              if [[ "${run_status}" == completed ]]; then
                completed=true
                break
              fi
            fi

            echo "Attempt ${attempt}: run=${run_id:-absent} status=${run_status} conclusion=${run_conclusion:-pending}"
            sleep 15
          done

          {
            echo '## V6-H — exécution Production Deploy tentative 3'
            echo
            echo "- SHA : \`${TARGET_SHA}\`"
            echo "- Run : ${run_url:-non trouvé}"
            echo "- Identifiant : \`${run_id:-absent}\`"
            echo "- Statut : \`${run_status}\`"
            echo "- Conclusion : \`${run_conclusion:-en attente}\`"
            echo
            if [[ "${completed}" == true && "${run_conclusion}" == success ]]; then
              echo 'Décision du workflow : **déploiement terminé avec succès**.'
            elif [[ "${completed}" == true ]]; then
              echo 'Décision du workflow : **déploiement terminé en échec ou annulé**.'
            else
              echo 'Décision du workflow : **run absent ou non terminé dans la fenêtre de contrôle**.'
            fi
          } >/tmp/run-comment.md

          echo "found=${found}" >>"${GITHUB_OUTPUT}"
          echo "completed=${completed}" >>"${GITHUB_OUTPUT}"
          echo "conclusion=${run_conclusion}" >>"${GITHUB_OUTPUT}"

      - name: Publish run evidence to issue 184
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n --rawfile body /tmp/run-comment.md '{body: $body}' >/tmp/comment.json
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/comment.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            >/tmp/comment-response.json

      - name: Fail when deployment did not succeed
        if: steps.observe.outputs.completed != 'true' || steps.observe.outputs.conclusion != 'success'
        run: exit 1
