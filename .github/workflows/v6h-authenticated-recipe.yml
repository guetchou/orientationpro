name: V6-H Authenticated Recipe

on:
  push:
    branches:
      - agent/v6h-authenticated-recipe
    paths:
      - ops/recipe/start-v6h

permissions:
  contents: read
  issues: write

jobs:
  recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      V6H_WEB_URL: https://makoki.org
      V6H_API_ROOT: https://makoki.org/api
      RECIPE_BRANCH: agent/v6h-authenticated-recipe
    steps:
      - uses: actions/checkout@v6

      - name: Create dedicated account and request verification
        id: register
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          recipe_email="makemba02+v6h-${GITHUB_RUN_ID}@gmail.com"
          recipe_password="Aa1!$(openssl rand -hex 20)"
          token_path="ops/recipe/token-${GITHUB_RUN_ID}.b64"

          echo "::add-mask::${recipe_password}"
          printf 'V6H_RECIPE_EMAIL=%s\n' "${recipe_email}" >>"${GITHUB_ENV}"
          printf 'V6H_RECIPE_PASSWORD=%s\n' "${recipe_password}" >>"${GITHUB_ENV}"
          printf 'V6H_TOKEN_PATH=%s\n' "${token_path}" >>"${GITHUB_ENV}"

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/v6h-private.pem
          chmod 600 /tmp/v6h-private.pem
          openssl pkey -in /tmp/v6h-private.pem -pubout -out /tmp/v6h-public.pem
          public_key_b64="$(base64 -w0 /tmp/v6h-public.pem)"

          jq -n --arg email "${recipe_email}" --arg password "${recipe_password}" \
            '{email: $email, password: $password}' >/tmp/register.json
          register_status=$(curl --silent --show-error --output /tmp/register-response.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data-binary @/tmp/register.json \
            "${V6H_API_ROOT}/v1/auth/register")
          test "${register_status}" = 201

          cat >/tmp/handshake.md <<EOF
          ## V6-H — vérification chiffrée requise

          - Run ID : \`${GITHUB_RUN_ID}\`
          - Compte dédié : \`${recipe_email}\`
          - Chemin attendu : \`${token_path}\`
          - Branche : \`${RECIPE_BRANCH}\`
          - État : attente du jeton de vérification reçu par e-mail

          \`PUBLIC_KEY_B64=${public_key_b64}\`

          Le jeton doit être chiffré en RSA-OAEP SHA-256 puis déposé encodé en base64. Aucun mot de passe ni jeton en clair ne doit être publié.
          EOF
          gh api "repos/${GITHUB_REPOSITORY}/issues/184/comments" -F body=@/tmp/handshake.md

      - name: Wait for encrypted verification token
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          found=false

          for attempt in $(seq 1 180); do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/${V6H_TOKEN_PATH}?ref=${RECIPE_BRANCH}" >/tmp/token-content.json 2>/dev/null; then
              jq -r '.content' /tmp/token-content.json | tr -d '\n' | base64 -d >/tmp/token-ciphertext.b64
              tr -d '\r\n ' </tmp/token-ciphertext.b64 | base64 -d >/tmp/token-ciphertext.bin
              openssl pkeyutl -decrypt \
                -inkey /tmp/v6h-private.pem \
                -in /tmp/token-ciphertext.bin \
                -out /tmp/verification-token.txt \
                -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 \
                -pkeyopt rsa_mgf1_md:sha256
              verification_token="$(tr -d '\r\n' </tmp/verification-token.txt)"
              test -n "${verification_token}"
              echo "::add-mask::${verification_token}"
              printf 'V6H_VERIFICATION_TOKEN=%s\n' "${verification_token}" >>"${GITHUB_ENV}"
              found=true
              break
            fi
            echo "Waiting for encrypted verification token (${attempt}/180)."
            sleep 10
          done

          test "${found}" = true

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install recipe dependencies and Chromium
        run: |
          set -Eeuo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify account and public API contracts
        env:
          V6H_RECIPE_PHASE: initial
          V6H_RECIPE_OUTPUT: /tmp/v6h-api-initial.json
        run: node scripts/release/v6h-authenticated-recipe.cjs

      - name: Complete guest to authenticated browser recipe
        env:
          V6H_BROWSER_OUTPUT: /tmp/v6h-browser.json
          V6H_SCREENSHOT_PATH: /tmp/v6h-authenticated-parcours.png
          V6H_PDF_PATH: /tmp/v6h-authenticated-synthesis.pdf
        run: node scripts/release/v6h-launch-browser.cjs

      - name: Verify browser project persisted through public API
        env:
          V6H_RECIPE_PHASE: final
          V6H_RECIPE_OUTPUT: /tmp/v6h-api-final.json
        shell: bash
        run: |
          set -Eeuo pipefail
          project_id=$(jq -r '.projectId' /tmp/v6h-browser.json)
          test -n "${project_id}"
          V6H_PROJECT_ID="${project_id}" node scripts/release/v6h-authenticated-recipe.cjs

      - name: Publish sanitized GO evidence and close issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const browser = JSON.parse(fs.readFileSync('/tmp/v6h-browser.json', 'utf8'));
          const final = JSON.parse(fs.readFileSync('/tmp/v6h-api-final.json', 'utf8'));
          const required = [
            browser.guestPreviewVisible,
            browser.claimedAfterLogin,
            browser.authenticatedResultVisible,
            browser.comparisonComplete,
            browser.provisionalChoiceVisible,
            browser.persistenceAfterReload,
            browser.persistenceAfterRelogin,
            browser.printableSynthesisVisible,
            browser.printedComparisonVisible,
            browser.screenshotCreated,
            browser.pdfCreated,
            browser.consoleErrorCount === 0,
            browser.pageErrorCount === 0,
            browser.serverErrorCount === 0,
            final.projectState === 'provisional_choice',
          ];
          if (required.some((value) => !value)) throw new Error('The final evidence set is incomplete.');

          const lines = [
            '## V6-H — recette authentifiée finale GO',
            '',
            `- SHA production observé par le déploiement : \`${process.env.GITHUB_SHA}\``,
            `- Compte dédié : \`${process.env.V6H_RECIPE_EMAIL}\``,
            '- Questionnaire invité : 60 affirmations terminées',
            '- Aperçu invité limité : conforme',
            '- Rattachement après connexion : réussi',
            `- Recommandations : ${browser.scenarioCount} scénario(s)`,
            `- Durée et coût : ${browser.durationCostVisible ? 'visibles' : 'non visibles'}`,
            `- Calendrier : ${browser.calendarVisible ? 'visible' : 'non visible'}`,
            `- Modalités : ${browser.modalitiesVisible ? 'visibles' : 'non visibles'}`,
            '- Tableau comparatif complet : visible',
            '- Choix provisoire : effectué et persistant',
            '- Persistance après actualisation : réussie',
            '- Persistance après nouvelle connexion : réussie',
            '- Synthèse dédiée : visible',
            '- Comparaison présente dans le mode impression : oui',
            '- Capture et PDF : créés dans les preuves privées du run',
            '- Erreurs console / page / HTTP 5xx : 0 / 0 / 0',
            `- État final API : \`${final.projectState}\``,
            `- Option retenue : ${final.selectedScenario.title}`,
            `- Première action : ${final.selectedScenario.firstAction}`,
            '',
            'Décision : **GO AUTHENTIFIÉ**. Les conditions de clôture de #184 sont satisfaites. Le pilote humain jeune + conseiller reste suivi dans #205 et #169.',
          ];
          fs.writeFileSync('/tmp/v6h-authenticated-evidence.md', `${lines.join('\n')}\n`);
          NODE

          gh api "repos/${GITHUB_REPOSITORY}/issues/184/comments" -F body=@/tmp/v6h-authenticated-evidence.md
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/184" \
            -f state=closed -f state_reason=completed >/dev/null

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/184/comments" \
            -f body="## V6-H — recette finale NON CONCLUE

- Run ID : \`${GITHUB_RUN_ID}\`
- Compte dédié : \`${V6H_RECIPE_EMAIL:-non créé}\`
- Décision : **NON CONCLUE**. Une étape technique ou fonctionnelle a échoué ; consulter les artefacts privés sans exposer de secret."

      - name: Upload private recipe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6h-authenticated-recipe-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/v6h-api-initial.json
            /tmp/v6h-browser.json
            /tmp/v6h-api-final.json
            /tmp/v6h-authenticated-parcours.png
            /tmp/v6h-authenticated-synthesis.pdf
            /tmp/v6h-authenticated-evidence.md
