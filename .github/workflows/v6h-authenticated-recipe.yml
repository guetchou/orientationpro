name: V6-H Authenticated Recipe

on:
  push:
    branches:
      - test/v6h-authenticated-recipe-20260802
    paths:
      - ops/recipe/start-v6h

permissions:
  contents: read
  issues: write

jobs:
  recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      V6H_WEB_URL: https://makoki.org
      V6H_API_ROOT: https://makoki.org/api
      RECIPE_BRANCH: test/v6h-authenticated-recipe-20260802
      TRACKING_ISSUE: '184'
    steps:
      - uses: actions/checkout@v6

      - name: Create dedicated account and request verification
        id: register
        shell: bash
        run: |
          set -Eeuo pipefail

          recipe_email="makemba.02+v6h-${GITHUB_RUN_ID}@gmail.com"
          recipe_password="$(openssl rand -base64 36 | tr -d '\n')"
          token_path="ops/recipe/token-${GITHUB_RUN_ID}.b64"

          echo "::add-mask::${recipe_password}"
          printf 'V6H_RECIPE_EMAIL=%s\n' "${recipe_email}" >>"${GITHUB_ENV}"
          printf 'V6H_RECIPE_PASSWORD=%s\n' "${recipe_password}" >>"${GITHUB_ENV}"
          printf 'V6H_TOKEN_PATH=%s\n' "${token_path}" >>"${GITHUB_ENV}"
          printf 'recipe_email=%s\n' "${recipe_email}" >>"${GITHUB_OUTPUT}"
          printf 'token_path=%s\n' "${token_path}" >>"${GITHUB_OUTPUT}"

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/v6h-private.pem
          chmod 600 /tmp/v6h-private.pem
          openssl pkey -in /tmp/v6h-private.pem -pubout -out /tmp/v6h-public.pem

          jq -n --arg email "${recipe_email}" --arg password "${recipe_password}" \
            '{email: $email, password: $password}' >/tmp/register.json
          register_status=$(curl --silent --show-error --output /tmp/register-response.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data-binary @/tmp/register.json \
            "${V6H_API_ROOT}/v1/auth/register")
          test "${register_status}" = 201

          {
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RECIPE_EMAIL=${recipe_email}"
            echo "TOKEN_PATH=${token_path}"
          } >/tmp/v6h-handshake.txt
          chmod 600 /tmp/v6h-handshake.txt

      - name: Upload public handshake
        uses: actions/upload-artifact@v4
        with:
          name: v6h-authenticated-handshake-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          path: |
            /tmp/v6h-public.pem
            /tmp/v6h-handshake.txt

      - name: Publish recipe checkpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          body=$(cat <<EOF
          ## V6-H — nouvelle recette authentifiée

          - Run ID : \`${GITHUB_RUN_ID}\`
          - Branche : \`${RECIPE_BRANCH}\`
          - Compte dédié : \`${V6H_RECIPE_EMAIL}\`
          - État : attente de la vérification chiffrée de l’adresse e-mail
          EOF
          )
          jq -n --arg body "${body}" '{body: $body}' >/tmp/issue-comment.json
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/issue-comment.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" >/dev/null

      - name: Wait for encrypted verification token
        shell: bash
        run: |
          set -Eeuo pipefail
          found=false

          for attempt in $(seq 1 100); do
            status=$(curl --silent --show-error --output /tmp/token-content.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${V6H_TOKEN_PATH}?ref=${RECIPE_BRANCH}" || true)

            if [[ "${status}" == 200 ]]; then
              jq -r '.content' /tmp/token-content.json | tr -d '\n' | base64 -d >/tmp/token-ciphertext.b64
              tr -d '\r\n ' </tmp/token-ciphertext.b64 | base64 -d >/tmp/token-ciphertext.bin
              openssl pkeyutl -decrypt \
                -inkey /tmp/v6h-private.pem \
                -in /tmp/token-ciphertext.bin \
                -out /tmp/verification-token.txt \
                -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 \
                -pkeyopt rsa_mgf1_md:sha256
              verification_token="$(tr -d '\r\n' </tmp/verification-token.txt)"
              test -n "${verification_token}"
              echo "::add-mask::${verification_token}"
              printf 'V6H_VERIFICATION_TOKEN=%s\n' "${verification_token}" >>"${GITHUB_ENV}"
              found=true
              break
            fi

            echo "Waiting for encrypted verification token (${attempt}/100)."
            sleep 10
          done

          test "${found}" = true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install recipe dependencies and Chromium
        run: |
          set -Eeuo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify account and served production SHA
        env:
          V6H_RECIPE_PHASE: initial
          V6H_RECIPE_OUTPUT: /tmp/v6h-api-initial.json
        run: node scripts/release/v6h-authenticated-recipe.cjs

      - name: Execute guest to account browser journey
        env:
          V6H_BROWSER_OUTPUT: /tmp/v6h-browser.json
          V6H_SCREENSHOT_PATH: /tmp/v6h-authenticated-parcours.png
          V6H_PDF_PATH: /tmp/v6h-authenticated-synthesis.pdf
        run: node scripts/release/v6h-authenticated-browser.cjs

      - name: Verify final persisted state through public API
        env:
          V6H_RECIPE_PHASE: final
          V6H_RECIPE_OUTPUT: /tmp/v6h-api-final.json
        shell: bash
        run: |
          set -Eeuo pipefail
          project_id=$(jq -r '.projectId' /tmp/v6h-browser.json)
          test -n "${project_id}"
          V6H_PROJECT_ID="${project_id}" node scripts/release/v6h-authenticated-recipe.cjs

      - name: Build sanitized evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          JOB_STATUS="${JOB_STATUS}" V6H_RECIPE_EMAIL="${V6H_RECIPE_EMAIL}" node <<'NODE'
          const fs = require('node:fs');
          const read = (path) => {
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); } catch { return null; }
          };
          const initial = read('/tmp/v6h-api-initial.json');
          const browser = read('/tmp/v6h-browser.json');
          const final = read('/tmp/v6h-api-final.json');
          const technicallyPassed = process.env.JOB_STATUS === 'success' && initial && browser && final;
          const completeComparison = Boolean(browser?.comparisonComplete);
          const printableSynthesis = Boolean(browser?.printableSynthesisVisible);
          const fullyPassed = technicallyPassed && completeComparison && printableSynthesis;
          const decision = fullyPassed ? 'GO AUTHENTIFIÉ' : technicallyPassed ? 'GO LIMITÉ' : 'NON CONCLUE';
          const lines = [
            `## V6-H — recette authentifiée ${decision}`,
            '',
            `- SHA réellement servi : \`${initial?.servedSha || 'non observé'}\``,
            `- Compte dédié : \`${process.env.V6H_RECIPE_EMAIL || 'non créé'}\``,
            `- Vérification email et connexion : ${initial?.verified ? 'réussies' : 'non prouvées'}`,
            `- Questionnaire invité : ${browser?.guestPreviewVisible ? '60 affirmations terminées' : 'non prouvé'}`,
            `- Aperçu invité limité : ${browser?.lockedSectionsVisible && browser?.guestCareerLinkCount === 0 ? 'conforme, sans lien de contournement' : 'non conforme ou non prouvé'}`,
            `- Rattachement après connexion : ${browser?.claimedAfterLogin ? 'réussi' : 'non prouvé'}`,
            `- Recommandations : ${browser ? `${browser.scenarioCount} scénario(s)` : 'non prouvées'}`,
            `- Durée et coût : ${browser?.durationCostVisible ? 'visibles' : 'non prouvés'}`,
            `- Calendrier et modalités : ${completeComparison ? 'visibles' : 'incomplets dans l’interface actuelle'}`,
            `- Première action : ${browser?.firstActionVisible && final?.selectedScenario?.firstAction ? final.selectedScenario.firstAction : 'non prouvée'}`,
            `- Choix provisoire : ${browser?.provisionalChoiceVisible ? 'effectué' : 'non prouvé'}`,
            `- Persistance après actualisation : ${browser?.persistenceAfterReload ? 'réussie' : 'non prouvée'}`,
            `- Persistance après nouvelle connexion : ${browser?.persistenceAfterRelogin ? 'réussie' : 'non prouvée'}`,
            `- Synthèse dédiée et impression : ${printableSynthesis ? 'présentes' : 'absentes ou incomplètes dans le parcours actuel'}`,
            `- Erreurs console / page / HTTP 5xx : ${browser ? `${browser.consoleErrorCount} / ${browser.pageErrorCount} / ${browser.serverErrorCount}` : 'non observées'}`,
            `- État final API : \`${final?.projectState || 'non observé'}\``,
            `- Option retenue : ${final?.selectedScenario?.title || 'non observée'}`,
            '',
            fullyPassed
              ? 'Décision : **GO authentifié**. Les critères techniques et fonctionnels de #184 sont démontrés. Le pilote humain #205 reste distinct.'
              : technicallyPassed
                ? 'Décision : **GO limité**. Le parcours invité → compte → recommandations → choix persiste réellement, mais la comparaison complète et/ou la synthèse imprimable doivent être complétées avant de fermer #184.'
                : 'Décision : **NON CONCLUE**. Une étape technique ou fonctionnelle a échoué ; consulter les artefacts privés du run.',
            '',
            'Note : le compte aliasé est réservé à la recette et ne contient aucune donnée personnelle réelle.',
          ];
          fs.writeFileSync('/tmp/v6h-authenticated-evidence.md', `${lines.join('\n')}\n`);
          NODE
          cat /tmp/v6h-authenticated-evidence.md

      - name: Publish sanitized evidence to issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f /tmp/v6h-authenticated-evidence.md ]]; then
            jq -Rs '{body: .}' </tmp/v6h-authenticated-evidence.md >/tmp/evidence-comment.json
          else
            jq -n --arg body "## V6-H — recette NON CONCLUE\n\nLe run ${GITHUB_RUN_ID} n’a pas produit de rapport exploitable." '{body: $body}' >/tmp/evidence-comment.json
          fi
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/evidence-comment.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" >/dev/null

      - name: Upload private recipe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6h-authenticated-recipe-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/v6h-api-initial.json
            /tmp/v6h-browser.json
            /tmp/v6h-api-final.json
            /tmp/v6h-authenticated-parcours.png
            /tmp/v6h-authenticated-synthesis.pdf
            /tmp/v6h-authenticated-evidence.md
