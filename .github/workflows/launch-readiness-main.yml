name: Launch Readiness Main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/launch-readiness-main.yml

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Charger le correctif et le harnais V6-H
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin feat/launch-readiness-final-20260803 --depth=1
          git show FETCH_HEAD:scripts/launch/apply-launch-readiness.mjs > /tmp/apply-launch-readiness.mjs
          git fetch origin test/v6h-authenticated-recipe-20260802 --depth=1
          git show FETCH_HEAD:.github/workflows/v6h-authenticated-recipe.yml > .github/workflows/v6h-authenticated-recipe.yml
          git show FETCH_HEAD:scripts/release/v6h-authenticated-browser.cjs > scripts/release/v6h-authenticated-browser.cjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Appliquer les corrections de lancement
        run: node /tmp/apply-launch-readiness.mjs

      - name: Installer et vérifier
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run typecheck
          npm run test
          npm run build
          node --check backend/src/orientation/riasec/instrument.js
          node --check scripts/release/v6h-authenticated-browser.cjs
          git diff --check

      - name: Publier uniquement après validation
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/launch-readiness-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat(launch): finaliser les contenus, services et rapports"
          git push origin HEAD:main
