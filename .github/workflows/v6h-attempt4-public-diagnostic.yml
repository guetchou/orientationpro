name: V6-H Attempt 4 Public Diagnostic

on:
  push:
    branches:
      - agent/v6h-public-production-probe

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ddaad08645e61b148d164af166b9e823d381fc05
      ISSUE_NUMBER: '184'
    steps:
      - name: Collect exact public statuses
        shell: bash
        run: |
          set -u
          request() {
            local name="$1"
            local url="$2"
            local output="/tmp/${name}.body"
            local status
            status=$(curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 \
              --silent --show-error --output "${output}" --write-out '%{http_code}' "${url}" || true)
            printf '%s' "${status}" >"/tmp/${name}.status"
          }

          request root https://makoki.org/
          request parcours https://makoki.org/parcours
          request health https://makoki.org/api/test/health
          request capabilities https://makoki.org/api/v1/capabilities
          request life_unauth https://makoki.org/api/v1/life-projects

          TARGET_SHA="${TARGET_SHA}" node <<'NODE'
          const fs = require('node:fs');
          const read = (name) => {
            const status = fs.readFileSync(`/tmp/${name}.status`, 'utf8');
            const body = fs.readFileSync(`/tmp/${name}.body`, 'utf8');
            return { status, body };
          };
          const safeJson = (body) => { try { return JSON.parse(body); } catch { return null; } };
          const root = read('root');
          const parcours = read('parcours');
          const healthResponse = read('health');
          const capabilitiesResponse = read('capabilities');
          const unauth = read('life_unauth');
          const health = safeJson(healthResponse.body);
          const registry = safeJson(capabilitiesResponse.body);
          const unauthJson = safeJson(unauth.body);
          const byId = (id) => registry?.capabilities?.find((entry) => entry.id === id);
          const capabilities = [
            'identity.auth-v1', 'life-project.core-v1', 'orientation.riasec',
            'career.recommendations', 'cv.analysis-v1', 'privacy.data-rights-v1',
            'identity.auth-legacy',
          ].map((id) => {
            const entry = byId(id);
            return `- \`${id}\`: ${entry ? `${entry.status}, configured=${entry.configured}` : 'absent'}`;
          }).join('\n');
          const lines = [
            '## V6-H — diagnostic public après déploiement tentative 4',
            '',
            `- SHA attendu : \`${process.env.TARGET_SHA}\``,
            `- SHA servi : \`${health?.gitSha ?? 'non lisible'}\``,
            `- \`/\` : HTTP ${root.status}`,
            `- \`/parcours\` : HTTP ${parcours.status}`,
            `- santé : HTTP ${healthResponse.status}, statut \`${health?.status ?? 'non lisible'}\``,
            `- registre : HTTP ${capabilitiesResponse.status}, schéma \`${registry?.schemaVersion ?? 'non lisible'}\``,
            `- life-project non authentifié : HTTP ${unauth.status}, code \`${unauthJson?.code ?? 'absent'}\`, message \`${unauthJson?.message ?? unauth.body.slice(0, 160).replaceAll('`', '')}\``,
            '',
            '### Capacités',
            capabilities,
          ];
          fs.writeFileSync('/tmp/diagnostic.md', `${lines.join('\n')}\n`);
          NODE

      - name: Publish diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n --rawfile body /tmp/diagnostic.md '{body: $body}' >/tmp/comment.json
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/comment.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            >/tmp/comment-response.json
