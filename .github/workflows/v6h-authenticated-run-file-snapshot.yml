name: V6-H Authenticated Run File Snapshot

on:
  push:
    branches:
      - agent/v6h-public-production-probe

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v6h-public-production-probe
      - name: Write authenticated run snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 8
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent%2Fv6h-authenticated-recipe&event=push&per_page=30" \
            >ops/recipe/authenticated-runs.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/recipe/authenticated-runs.json
          git commit -m 'test(production): actualiser les runs authentifiés' || exit 0
          git push origin HEAD:agent/v6h-public-production-probe
