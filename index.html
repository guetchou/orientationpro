<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#047857" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="MAKOKI vous aide à comprendre vos intérêts, explorer les métiers et construire votre projet d'études ou d'emploi au Congo." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260724-42c61208" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico?v=20260724-42c61208" />
    <link rel="canonical" href="https://makoki.org/" />
    <link rel="manifest" href="/manifest.json" />

    <!--
      Typographie de marque. Graisses limitées à celles réellement utilisées
      (Inter 400/500/600, Montserrat 600/700) : la connexion mobile est souvent
      lente et coûteuse au Congo. `display=swap` affiche le texte immédiatement.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap"
    />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="MAKOKI" />
    <meta property="og:title" content="MAKOKI — Orientation, compétences et emploi" />
    <meta property="og:description" content="Comprenez votre profil, explorez les métiers et construisez votre avenir avec des données explicables." />
    <meta property="og:url" content="https://makoki.org/" />
    <meta property="og:image" content="https://makoki.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MAKOKI — Orientation, compétences et emploi au Congo" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MAKOKI — Orientation, compétences et emploi" />
    <meta name="twitter:description" content="Comprenez votre profil, explorez les métiers et construisez votre avenir avec des données explicables." />
    <meta name="twitter:image" content="https://makoki.org/og-image.png" />

    <title>MAKOKI — Orientation, compétences et emploi</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MAKOKI",
        "url": "https://makoki.org/",
        "inLanguage": "fr",
        "description": "Plateforme d'orientation, de compétences et d'emploi conçue pour aider à comprendre son profil et explorer les métiers."
      }
    </script>
    <style>
      /* App-shell : paint de marque instantane avant le montage de React,
         pour supprimer l'ecran blanc pendant le chargement du bundle SPA.
         React (createRoot) remplace ce contenu au montage. */
      .ms-shell { min-height: 100vh; background: #fafaf9; display: flex; flex-direction: column; }
      .ms-shell-bar { display: flex; align-items: center; gap: 12px; height: 80px; padding: 0 24px; border-bottom: 1px solid #e2e8f0; background: #fff; }
      .ms-shell-logo { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: #047857; color: #fff; font-weight: 700; font-size: 20px; font-family: system-ui, sans-serif; }
      .ms-shell-brand { display: flex; flex-direction: column; line-height: 1.15; font-family: system-ui, sans-serif; }
      .ms-shell-brand b { font-size: 20px; color: #020617; font-weight: 700; }
      .ms-shell-brand span { font-size: 12px; color: #64748b; }
      .ms-shell-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
      .ms-shell-spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #d1fae5; border-top-color: #047857; animation: ms-spin 0.8s linear infinite; }
      .ms-shell-text { color: #64748b; font-size: 14px; font-family: system-ui, sans-serif; }
      @keyframes ms-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .ms-shell-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ms-shell" role="status" aria-label="Chargement de MAKOKI">
        <header class="ms-shell-bar">
          <span class="ms-shell-logo">M</span>
          <span class="ms-shell-brand"><b>MAKOKI</b><span>Orientation • Compétences • Emploi</span></span>
        </header>
        <div class="ms-shell-body">
          <div class="ms-shell-spinner"></div>
          <p class="ms-shell-text">Chargement…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
